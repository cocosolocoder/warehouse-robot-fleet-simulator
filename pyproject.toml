[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-robot-fleet-simulator"
version = "0.1.0"
description = "Deterministic local simulator for warehouse robot fleets"
requires-python = ">=3.11"

[project.scripts]
warehouse-fleet = "warehouse_fleet.__main__:main"

[tool.setuptools.packages.find]
include = ["warehouse_fleet*"]

